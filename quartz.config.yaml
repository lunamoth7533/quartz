# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
# Research Atlas - local reading and research site over the Obsidian research vault.
configuration:
  pageTitle: Research Atlas
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # Personal, local library: no analytics provider and no added telemetry.
  analytics: null
  locale: en-US
  baseUrl: localhost:8080
  # `Research/AGENTS.md` and `Research/Templates/**` are deliberately NOT listed
  # here: other notes link to them, and ignoring them made those references 404.
  # They are built and marked unlisted instead (research-atlas/utility-pages.ts),
  # which keeps them out of the index, search, explorer, graph and the dashboards.
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .claudian
    - .omc
    - src
  theme:
    # Fonts are downloaded at build time and served from this site, so browsing
    # never contacts a font CDN.
    fontOrigin: selfHosted
    cdnCaching: false
    typography:
      header: Fraunces
      body: Source Serif 4
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf6ef"
        lightgray: "#e9e1d3"
        # 5.2:1 on the paper background; `gray` carries small meaningful labels.
        gray: "#726656"
        darkgray: "#3f3a34"
        dark: "#211d18"
        secondary: "#125e5b"
        tertiary: "#2f8f80"
        highlight: rgba(18, 94, 91, 0.1)
        textHighlight: "#f2d27a88"
      darkMode:
        light: "#1b1b1d"
        lightgray: "#34343a"
        gray: "#9a9ca6"
        darkgray: "#d9d5cd"
        dark: "#f4f1ea"
        secondary: "#6fd3c4"
        tertiary: "#9fe0d4"
        highlight: rgba(111, 211, 196, 0.12)
        textHighlight: "#d8c26a88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 20
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: selfHosted
      useThemeFonts: false
      # Families are fetched and self-hosted by this plugin; local fallbacks are
      # added as unlayered CSS overrides in quartz/styles/custom.scss.
      body: Source Serif 4
      header: Fraunces
      title: Fraunces
      interface: Inter
      code: IBM Plex Mono
  # Quartz Themes ships its own palettes (including the "default" theme, which
  # overrides --secondary/--light with a violet scheme). The Research Atlas
  # palette is defined in configuration.theme above, so the theme layer is off.
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: false
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  # Canvas and Base pages are provided by the site's own page types
  # (`research-atlas/page-types.ts`) so the persistent quick navigation reaches
  # those surfaces. Both reuse the installed matchers, generators, frames and
  # transforms; their manifest defaults are passed through unchanged.
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 40
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 25
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Quartz: https://quartz.jzhao.xyz
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: false
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
